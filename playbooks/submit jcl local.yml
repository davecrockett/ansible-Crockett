# Writes the JCL inline, submits it, and prints the spool output.
- name: Hello World JCL job
  hosts: zoslab
  gather_facts: false
  collections:
    - ibm.ibm_zos_core
  environment: "{{ environment_vars }}"

  tasks:
    - name: Submit local
      zos_job_submit:
        src: "{{ playbook_dir}}/JCL/helowrld.txt" 
        location: local
        encoding:
          from: UTF-8
          to: IBM-1047
      register: job_output

    - name: Show job ID and return code
      ansible.builtin.debug:
        msg: "Job {{ job_result.jobs[0].job_id }}"