---
- name: Hello World JCL job
  hosts: zoslab
  gather_facts: false
  collections:
    - ibm.ibm_zos_core
  environment: "{{ environment_vars }}"

  tasks:
    - name: Submit local
      zos_job_submit:
        src: "{{ GAMA06.JCL.CNTL(HELOWRLD)}}"
        remote_src: true
        location: DATA_SET
        wait_time_s: 30
      register: job_output

    - name: Show job ID and return code
      ansible.builtin.debug:
        msg: "Job {{ job_result.jobs[0].job_id }}"





